<!DOCTYPE html>
<html lang="uk" class="h-full bg-[#0a0d14]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEEBWE LLC // Modern Software & Infrastructure</title>

  <!-- Canonical URL -->
  <link rel="canonical" href="https://weebwe.io/">

  <!-- 1. ПІДКТЮЧЕННЯ FAVICONS ТА MANIFEST ПРЯМО ЧЕРЕЗ ДОМЕН WEEBWE.IO -->
  <link rel="icon" type="image/x-icon" href="https://weebwe.io/assets/favicons/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="https://weebwe.io/assets/favicons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="https://weebwe.io/assets/favicons/apple-touch-icon.png">
  <link rel="manifest" href="https://weebwe.io/assets/favicons/site.webmanifest">

  <!-- 2. OPEN GRAPH / SOCIAL PREVIEW (ДЛЯ TELEGRAM, DISCORD, X) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://weebwe.io/">
  <meta property="og:title" content="WEEBWE LLC // Next-Gen Systems">
  <meta property="og:description" content="Architecting high-load software solutions and modern infrastructure.">
  <meta property="og:image" content="https://weebwe.io/assets/og-image.webp">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0a0d14',
              card: '#121824',
              cyan: '#00d2ff',
              blue: '#0066ff'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      height: 100dvh;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-brand-dark text-slate-100 flex flex-col justify-between p-6 sm:p-10 select-none antialiased relative">

  <!-- Background Ambient Glow -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cyan-950/30 via-brand-dark to-brand-dark pointer-events-none"></div>

  <!-- Header -->
  <header class="relative z-10 flex justify-between items-center max-w-6xl mx-auto w-full border-b border-slate-800/60 pb-4">
    <div class="flex items-center space-x-3">
      <!-- Логотип через основний домен -->
      <img src="https://weebwe.io/assets/weebwe.webp" 
           alt="WEEBWE Logo" 
           class="h-9 w-auto drop-shadow-[0_0_12px_rgba(0,210,255,0.4)]">
    </div>
    
    <div class="flex items-center space-x-2 bg-brand-card/80 border border-slate-800 px-3 py-1.5 rounded-full backdrop-blur-sm">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
      <span class="text-xs font-mono text-cyan-400">WEEBWE.IO // ONLINE</span>
    </div>
  </header>

  <!-- Hero Main Area -->
  <main class="relative z-10 flex flex-col items-center justify-center text-center max-w-3xl mx-auto my-auto px-4">
    
    <!-- Центральне неонове лого -->
    <div class="relative mb-6">
      <img src="https://weebwe.io/assets/weebwe.webp" 
           alt="WEEBWE LLC Brand Asset" 
           class="h-28 sm:h-36 w-auto mx-auto drop-shadow-[0_0_25px_rgba(0,210,255,0.5)] transition-all duration-500 hover:scale-105">
    </div>

    <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-indigo-500 mb-4">
      WEEBWE LLC
    </h1>

    <p class="text-slate-400 text-sm sm:text-base max-w-xl font-light leading-relaxed mb-8">
      Architecting high-load cloud solutions, modern software systems, and resilient digital infrastructure.
    </p>

    <!-- Кнопка зв'язку -->
    <a href="mailto:admin@weebwe.io" 
       class="inline-flex items-center space-x-2 px-6 py-3 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-bold text-sm shadow-[0_0_20px_rgba(0,210,255,0.3)] hover:shadow-[0_0_30px_rgba(0,210,255,0.6)] transition-all transform hover:-translate-y-0.5">
      <span>Contact Engineering</span>
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </a>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 flex flex-col sm:flex-row justify-between items-center max-w-6xl mx-auto w-full text-xs text-slate-500 font-mono border-t border-slate-800/60 pt-4">
    <div>&copy; 2026 WEEBWE LLC. All rights reserved.</div>
    <div class="mt-2 sm:mt-0 flex space-x-4">
      <a href="mailto:admin@weebwe.io" class="hover:text-cyan-400 transition-colors">admin@weebwe.io</a>
      <span>//</span>
      <a href="https://weebwe.io" class="text-slate-400 hover:text-cyan-400 transition-colors">weebwe.io</a>
    </div>
  </footer>

</body>
</html>
