<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weebwe</title>

    <!-- Фавіконки та іконки для пристроїв -->
    <link rel="icon" type="image/svg+xml" href="https://weebwe.io/assets/favicons/favicon.svg">
    <link rel="icon" type="image/x-icon" href="https://weebwe.io/assets/favicons/favicon.ico">
    <link rel="shortcut icon" href="https://weebwe.io/assets/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="https://weebwe.io/assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="96x96" href="https://weebwe.io/assets/favicons/favicon-96x96.png">
    <link rel="manifest" href="https://weebwe.io/assets/favicons/site.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Weebwe">

    <!-- Футуристичний шрифт Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Центральна секція */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
        }

        /* Загальний контейнер бренду */
        .brand-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(15px, 3.5vw, 28px);
        }

        /* Збільшений логотип з особливою появою */
        .brand-logo {
            height: clamp(60px, 12vh, 120px); /* Збільшено висоту */
            width: auto;
            object-fit: contain;
            user-select: none;
            opacity: 0;
            animation: introLogoSpecial 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes introLogoSpecial {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-5deg);
                filter: blur(15px) drop-shadow(0 0 0px rgba(31, 181, 255, 0));
            }
            50% {
                opacity: 1;
                transform: scale(1.12) rotate(0deg);
                filter: blur(0px) drop-shadow(0 0 45px rgba(31, 181, 255, 0.95));
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0px) drop-shadow(0 0 20px rgba(31, 181, 255, 0.45));
            }
        }

        /* Текстовий блок із центруванням елементів всередині */
        .brand-text-block {
            display: flex;
            flex-direction: column;
            align-items: center; /* Центрування назви та слогану відносно один одного */
            justify-content: center;
            text-align: center;
        }

        /* Поява назви компанії */
        .brand-title {
            color: #1fb5ff;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 5.5vw, 4rem);
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1;
            white-space: nowrap;
            opacity: 0;
            
            animation: revealTitle 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.2s;
        }

        @keyframes revealTitle {
            0% {
                opacity: 0;
                transform: translateX(-15px) scale(0.95);
                filter: blur(12px);
                text-shadow: 0 0 40px rgba(31, 181, 255, 1);
            }
            50% {
                opacity: 0.8;
                filter: blur(2px);
                text-shadow: 0 0 25px rgba(31, 181, 255, 0.9);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
                filter: blur(0px);
                text-shadow: 0 0 15px rgba(31, 181, 255, 0.4);
            }
        }

        /* Відцентрований слоган під назвою */
        .brand-slogan {
            color: #ffffff;
            font-size: clamp(0.52rem, 1.5vw, 0.88rem);
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 10px;
            text-transform: uppercase;
            white-space: nowrap;
            opacity: 0;
            width: 100%;
            text-align: center;
            
            animation: revealSlogan 1.2s ease forwards 3.2s;
        }

        @keyframes revealSlogan {
            0% {
                opacity: 0;
                transform: translateY(8px);
                filter: blur(6px);
            }
            100% {
                opacity: 0.9;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Футер */
        footer {
            padding-bottom: clamp(16px, 3vh, 24px);
            padding-left: 10px;
            padding-right: 10px;
            text-align: center;
            color: #ffffff;
            font-size: clamp(0.68rem, 1.8vw, 0.82rem);
            letter-spacing: 0.5px;
            opacity: 0;
            animation: fadeInFooter 1s ease forwards 3.6s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            width: 100%;
        }

        .footer-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 6px 10px;
            line-height: 1.3;
        }

        .footer-info .divider {
            color: #1fb5ff;
            opacity: 0.6;
        }

        .footer-email {
            color: #1fb5ff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease, text-shadow 0.2s ease;
        }

        .footer-email:hover {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(31, 181, 255, 0.8);
        }

        @keyframes fadeInFooter {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div></div>

    <!-- Блок з логотипом та текстом -->
    <div class="main-content">
        <div class="brand-wrapper">
            <img src="https://weebwe.io/assets/weebwe.webp" alt="Weebwe Logo" class="brand-logo">
            <div class="brand-text-block">
                <div class="brand-title">WEEBWE</div>
                <div class="brand-slogan">INNOVATIONS CREATING THE FUTURE!</div>
            </div>
        </div>
    </div>

    <!-- Футер -->
    <footer>
        <div class="footer-info">
            <span>&copy; 2026 WEEBWE LLC. Усі права захищено.</span>
            <span class="divider">•</span>
            <span>Зв'язок: <a href="mailto:hello@weebwe.io" class="footer-email">hello@weebwe.io</a></span>
        </div>
    </footer>

</body>
</html>
